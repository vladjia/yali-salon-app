      <div class="header-actions">
        <button type="button" data-act="reload">↻ 更新</button>
        <a id="priceLink" class="button-link" href="#">價目表</a>
      </div>
    </header>

    <section id="accessPanel" class="panel" hidden aria-labelledby="accessTitle">
  <h2 id="accessTitle">請用元家給的連結打開</h2>
  <p>若您手邊有專用金鑰，也可以貼在下方。</p>
  <form id="accessForm">
    <label for="accessKey">專用金鑰</label>
    <input id="accessKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="64" required aria-describedby="accessError">
    <p id="accessError" role="alert"></p>
    <button type="submit">開啟預約管理</button>
  </form>
</section>
<section class="panel">
      <div class="day-tabs">
        <button id="tabToday" type="button" data-act="today">今天</button>
        <button id="tabTomorrow" type="button" data-act="tomorrow">明天</button>
        <button id="tabOther" type="button" data-act="pickDay">選日期</button>
      </div>

      <div class="date-line">
        <button type="button" data-act="prevDay" aria-label="前一天">‹ 前一天</button>
        <input id="dayPicker" type="date" aria-label="選擇查看日期">
        <button type="button" data-act="nextDay" aria-label="後一天">後一天 ›</button>
      </div>

      <div id="finish" class="finish">正在讀取今天的預約…</div>
    </section>

    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>

    <div class="section-title">
      <h2 id="dayTitle">今天的安排</h2>
      <button type="button" class="primary" data-act="new">＋ 新增預約</button>
    </div>

    <section id="appointments" aria-live="polite">
      <div class="empty">正在載入，稍等一下喔…</div>
    </section>

    <div id="debug" class="debug"></div>
  </main>

  <div id="overlay" class="overlay" hidden>
    <section class="sheet" role="dialog" aria-modal="true"
             aria-labelledby="dialogTitle">
      <div class="sheet-head">
        <h2 id="dialogTitle">更改時間</h2>
        <button type="button" class="close"
                data-act="close" aria-label="關閉">×</button>
      </div>
      <div id="dialogBody"></div>
    </section>
  </div>

  <script>
    // Public endpoint only. The management key is supplied on the device.
const BASE = "https://script.google.com/macros/s/AKfycbwqoeuDgkqyVVMgauSyui6zdMf8rapHBPWxQ6fylPRLTs8RuibtHjQptaxlDLBkK8Wc/exec";
let KEY = YaliConnection.readKey();
async function call(fn, ...args) {
  const r = await YaliConnection.call(KEY, fn, ...args);
  if (r && r.code === 'FORBIDDEN') showKeyPrompt();
  else if (r?.ok) document.body.classList.remove('access-locked');
  return r;
}
function showKeyPrompt() {
  KEY = '';
  document.body.classList.add('access-locked');
  document.getElementById('accessPanel').hidden = false;
  document.getElementById('appointments').replaceChildren();
}

    const S = {
      today: '',
      selected: '',
      days: [],
      services: [],
      customers: [],
      dialog: null,
      lastMs: null
    };

    const $ = id => document.getElementById(id);

    function h(value) {
      return String(value == null ? '' : value).replace(
        /[&<>"']/g,
        c => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[c]
      );
    }

    function clock(s) {
      return s && s.length >= 16 ? s.slice(11, 16) : '--:--';
    }

    function shortDate(s) {
      return s && s.length >= 10 ? s.slice(5, 10).replace('-', '/') : '';
    }

    function longWhen(s) {
      return s ? shortDate(s.slice(0,10)) + ' ' + clock(s) : '';
    }

    function plusDays(date, amount) {
      const parts = date.split('-').map(Number);
      const utc = new Date(Date.UTC(parts[0], parts[1]-1, parts[2]+amount));
      return utc.toISOString().slice(0,10);
    }

    function weekday(date) {
      const parts = date.split('-').map(Number);
      const n = new Date(Date.UTC(parts[0],parts[1]-1,parts[2])).getUTCDay();
      return ['日','一','二','三','四','五','六'][n];
    }

    function makeOpId() {
      return 'op-' + Date.now().toString(36) +
        '-' + Math.random().toString(36).slice(2,8);
    }

    function responseError(r) {
      return r && r.message ? r.message : '操作沒有完成，請再確認一次';
    }

    function flash(message, type='info') {
      const el = $('notice');
      el.textContent = message;
      el.className = 'notice' +
        (type === 'error' ? ' error' : type === 'success' ? ' success' : '');
      el.hidden = false;
    }

    function statusName(status) {
      return ({
        PENDING: '申請中（要確認）',
        CONFIRMED: '已確認',
        RESCHEDULE_REQUESTED: '客人想改時間',
        COMPLETED: '已完成',
        CANCELLED: '已取消',
        REJECTED: '已拒絕'
      })[status] || status || '未標示';
    }

    function notifyText(item) {
      const c = item.customer || {};
      const n = item.notify;

      if (c.hasLine === false) {
        return '📞 電話客人，改期後記得打電話';
      }

      if (!n || n.status === '已合併') return '';

      if (n.status === '待送' || n.status === '失敗待重試')
        return '⏳ 通知中';

      if (n.status === '已送')
        return '✅ 已通知客人';

      if (n.status === '放棄' || n.status === '過期未送')
        return '⚠️ 沒通知到客人，請手動聯繫';

      if (n.status === '略過')
        return 'ℹ️ ' + (n.error || '系統略過通知');

      return '';
    }

    function replyText(item) {
      const b = item.booking || {};
      const reply = b.reply || '';

      if (reply.startsWith('好的')) return '✅ 客人說好';
      if (reply.startsWith('不方便')) return '⚠️ 客人說時間不方便';

      if (item.notify && item.notify.type === 'TIME_CHANGED')
        return '⏳ 等客人回覆';

      return '';
    }

    function getDay(date) {
      return S.days.find(d => d.date === date) ||
        { date, items: [], finish: null };
    }

    function getItem(id, date) {
      for (const d of S.days) {
        for (const item of (d.items || [])) {
          if (String(item.id) === String(id) &&
              (!date || (item.date || d.date) === date)) {
            return item;
          }
        }
      }
      return null;
    }

    async function loadDays(start='', quiet=false, automatic=false) {
      const request = ++listRequest;
      const selectedBefore = S.selected;
      const scrollBefore = {x:scrollX, y:scrollY};
      const began = performance.now();

      if (!quiet) {
        $('appointments').innerHTML =
          '<div class="empty">正在更新預約…</div>';
      }

      try {
        const r = await call('apiDays', start, 14);

        if (!r || !r.ok) throw new Error(responseError(r));

        if (request !== listRequest) return false;
        if ((quiet || automatic) && refreshBusy()) { deferRefresh(); return false; }
        if (automatic && S.selected !== selectedBefore) { deferRefresh(); return false; }
        S.today = r.today || S.today;
        if (!S.selected) S.selected = S.today;

        S.days = (r.days || [])
          .slice()
          .sort((a,b) => a.date.localeCompare(b.date));

        S.lastMs = Math.round(performance.now() - began);
        renderHome();
        window.YaliLineLinks?.refresh();
        if (automatic) window.scrollTo(scrollBefore.x, scrollBefore.y);
        return true;
      } catch (err) {
        if (automatic || request !== listRequest) return false;
        flash('讀取預約失敗：' + (err.message || String(err)), 'error');

        if (!quiet) {
          $('appointments').innerHTML =
            '<div class="empty">目前讀不到預約，請按「更新」重試。</div>';
        }
        return false;
      }
    }

    async function showDay(date) {
      if (!date) return;
      S.selected = date;

      if (!S.days.some(d => d.date === date)) {
        await loadDays(date);
      } else {
        renderHome();
      }
    }

    function renderHome() {
      if (!S.selected) return;

      const d = getDay(S.selected);
      const items = (d.items || [])
        .slice()
        .sort((a,b) => String(a.start).localeCompare(String(b.start)));

      $('dayPicker').value = S.selected;
      $('tabToday').classList.toggle('active', S.selected === S.today);
      $('tabTomorrow').classList.toggle(
        'active', S.selected === plusDays(S.today,1)
      );
      $('tabOther').classList.toggle(
        'active',
        S.selected !== S.today &&
        S.selected !== plusDays(S.today,1)
      );

      const prefix = S.selected === S.today
        ? '今天'
        : S.selected === plusDays(S.today,1) ? '明天' : '這天';

      $('dayTitle').textContent =
        prefix + '的安排 · ' + shortDate(S.selected) +
        '（週' + weekday(S.selected) + '）';

      $('finish').textContent = d.finish
        ? prefix + '預計做到 ' + clock(d.finish)
        : prefix + '目前沒有排定結束時間';

      $('appointments').innerHTML = items.length
        ? items.map(renderItem).join('')
        : '<div class="panel empty">🌷 這一天還沒有安排喔</div>';

      $('debug').textContent = S.lastMs == null
        ? ''
        : '測試資訊：本次讀取 ' + S.lastMs + 'ms';
    }

    function renderItem(item) {
      const c = item.customer || {};
      const name = h(c.name || '未填姓名');
      const service = h((item.services || []).join('、') || '未填服務');
      const start = clock(item.start);
      const end = clock(item.end);

      if (item.kind === 'event') {
        return `
          <article class="appointment event">
            <div class="appointment-top">
              <div class="time">${start}－${end}</div>
              <span class="pill gold">個人行程</span>
            </div>
            <div class="customer">${h(item.title || '私人安排')}</div>
            <div class="subline">${h(item.type || '')}</div>
          </article>`;
      }

      const id = h(item.id);
      const date = h(item.date || S.selected);

      if (item.kind === 'recurring') {
        const skipped = !!item.skipped;

        return `
          <article class="appointment recurring ${skipped ? 'skipped' : ''}">
            <div class="appointment-top">
              <div class="time">${start}－${end}</div>
              <span class="pill blue">${skipped ? '這次不來' : '固定客'}</span>
            </div>
            <div class="customer">${name}</div>
            <div class="service">${service}</div>
            <div class="subline">${h(c.phone || '')}</div>
            <div class="appointment-actions">
              ${skipped
                ? `<button class="main-action good"
                           data-act="restoreRecurring"
                           data-id="${id}" data-date="${date}">
                     ↩ 恢復這次預約
                   </button>`
                : `<button class="main-action primary"
                           data-act="editRecurring"
                           data-id="${id}" data-date="${date}">
                     🕒 更改時間
                   </button>`}
            </div>
          </article>`;
      }

      const b = item.booking || {};
      const st = b.status || '';
      const nt = notifyText(item);
      const rt = replyText(item);

      const other = [];

      if (st === 'PENDING') {
        other.push(`
          <button data-act="transition" data-id="${id}"
                  data-to="CONFIRMED">確認申請</button>`);
        other.push(`
          <button class="danger" data-act="transition" data-id="${id}"
                  data-to="REJECTED">拒絕</button>`);
      }

      if (st === 'CONFIRMED' || st === 'RESCHEDULE_REQUESTED') {
        other.push(`
          <button data-act="transition" data-id="${id}"
                  data-to="COMPLETED">標記完成</button>`);
      }

      if (st !== 'CANCELLED' && st !== 'REJECTED' && st !== 'COMPLETED') {
        other.push(`
          <button class="danger" data-act="transition" data-id="${id}"
                  data-to="CANCELLED">取消預約</button>`);
      }

      const canEdit = !['CANCELLED','REJECTED','COMPLETED'].includes(st);

      return `
        <article class="appointment">
          <div class="appointment-top">
            <div class="time">${start}－${end}</div>
            <span class="pill">${h(statusName(st))}</span>
          </div>
          <div class="customer">${name}</div>
          <div class="service">${service}</div>
          <div class="subline">${h(c.phone || '')}</div>
          ${b.recurringId
            ? '<div class="subline">🔁 固定客（這次改過時間）</div>'
            : ''}
          ${b.holdExpired
            ? '<div class="notice error">⚠️ 保留時間已過，請媽媽確認</div>'
            : ''}
          ${nt ? `<div class="subline">${h(nt)}</div>` : ''}
          ${rt ? `<div class="subline">${h(rt)}</div>` : ''}
          <div class="appointment-actions">
            ${canEdit
              ? `<button class="main-action primary"
                         data-act="editBooking" data-id="${id}">
                   🕒 更改時間
                 </button>`
              : ''}
            ${other.join('')}
          </div>
        </article>`;
    }

    function openDialog(dialog) {
      S.dialog = dialog;
      $('overlay').hidden = false;
      renderDialog();
    }

    function closeDialog(force=false) {
      if (S.dialog && S.dialog.busy && !force) return;
      S.dialog = null;
      $('overlay').hidden = true;
      $('dialogBody').innerHTML = '';
      if (pulsePending) setTimeout(pulseTick, 0);
    }

    function dialogMessage(d) {
      return d.error
        ? `<div class="modal-message" role="alert">${h(d.error)}</div>`
        : '';
    }

    function renderDialog() {
      const d = S.dialog;
      if (!d) return;

      let content = '';

      if (d.view === 'slots') {
        $('dialogTitle').textContent = '更改時間';

        const old = d.item.start || '';
        const quick = (d.slots && d.slots.quick) || [];
        const slots = (d.slots && d.slots.slots) || [];
        const date = d.date || old.slice(0,10);

        const reasons = {
          CONFLICT: '已經有人',
          OUT_OF_HOURS: '不在營業時間',
          PAST: '時間已過',
          BAD_INPUT: '時間不適用'
        };

        content = `
          <div class="panel">
            <div class="customer">${h(d.item.customer?.name || '')}</div>
            <div class="service">${h((d.item.services || []).join('、'))}</div>
            <div class="subline">目前時間：${h(longWhen(old))}</div>
          </div>

          ${dialogMessage(d)}

          ${d.loading
            ? '<div class="panel">正在尋找可以更改的時間…</div>'
            : ''}

          ${quick.length
            ? `<h3>快速選時間</h3>
               <div class="choice-grid">
                 ${quick.map(q => `
                   <button type="button" data-act="selectSlot"
                           data-start="${h(q.start || '')}"
                           ${q.ok ? '' : 'disabled'}>
                     ${h(q.label || clock(q.start))}
                     <span>${q.ok
                       ? h(longWhen(q.start))
                       : h(reasons[q.code] || q.code || '不可選')}</span>
                   </button>`).join('')}
               </div>`
            : ''}

          <h3>其他時間</h3>
          <div class="slot-grid">
            ${slots.map(s => {
              const v = typeof s === 'string' ? s : s.start;
              const full = v.includes(' ') ? v : date + ' ' + v;

    async function startBookingEdit(item) {
      openDialog({
        kind: 'booking', view: 'slots',
        item, date: item.start.slice(0,10),
        slots: null, selectedStart: '',
        loading: true, busy: false, opId: null
      });

      await loadSlots();
    }

    async function startRecurringEdit(item) {
      openDialog({
        kind: 'recurring', view: 'recMenu',
        item, date: item.date || S.selected,
        slots: null, selectedStart: '',
        loading: false, busy: false, opId: null
      });
    }

    async function loadSlots() {
      const d = S.dialog;
      if (!d) return;

      d.view = 'slots';
      d.loading = true;
      d.error = '';
      renderDialog();

      try {
        const r = d.kind === 'recurring'
          ? await call('apiRecurringSlots',
              d.item.id, d.item.date || S.selected, d.date)
          : await call('apiSlots', d.item.id, d.date);

        if (S.dialog !== d) return;

        if (!r || !r.ok) throw new Error(responseError(r));

        d.slots = r;
        if (d.kind === 'recurring' && r.minutes != null) {
          d.minutes = r.minutes;
        }
      } catch (err) {
        d.error = '讀取可改時間失敗：' + (err.message || String(err));
        d.slots = null;
      } finally {
        if (S.dialog === d) {
          d.loading = false;
          renderDialog();
        }
      }
    }

    function selectSlot(start) {
      const d = S.dialog;
      if (!d || !start) return;

      if (d.kind === 'recurring' && $('onceMinutes')) {
        const m = Number($('onceMinutes').value);
        d.minutes = m > 0 ? m : null;
      }

      // 選擇不同時間才會產生下一個新的操作編號。
      if (d.selectedStart !== start) d.opId = null;

      d.selectedStart = start;
      d.view = 'confirmEdit';
      d.error = '';
      renderDialog();
    }

    function localBookingUpdate(booking) {
      if (!booking || !booking.id) return;

      let oldItem = null;

      for (const day of S.days) {
        const index = (day.items || []).findIndex(
          item => item.kind === 'booking' &&
            item.booking && item.booking.id === booking.id
        );

        if (index !== -1) {
          oldItem = day.items.splice(index,1)[0];
          break;
        }
      }

      if (!oldItem) return;

      oldItem.booking = booking;
      oldItem.start = booking.start;
      oldItem.end = booking.end;

      const target = S.days.find(
        day => day.date === booking.start.slice(0,10)
      );

      if (target) {
        target.items = target.items || [];
        target.items.push(oldItem);
      }

      renderHome();
    }

    function notifyInBackground(notifyId) {
      if (!notifyId) return;

      call('apiNotifyNow', notifyId)
        .then(r => {
          if (!r || !r.ok) {
            flash('預約已修改，但通知未確認送達，請留意客人通知狀態。',
                  'error');
          }
          loadDays(S.selected, true);
        })
        .catch(() => {
          flash('預約已修改，但通知發送狀態不明，請稍後核對。',
                'error');
        });
    }

    function bookingEditSuccess(result, elapsed) {
      const d = S.dialog;
      const r = result && result.result && result.result.ok
        ? result.result : result;

      if (!r || !r.ok) return;

      localBookingUpdate(r.booking);
      closeDialog(true);

      S.lastMs = Math.round(elapsed);
      flash('✅ 修改完成！' +
        (d && d.item.customer?.hasLine === false
          ? ' 這位客人沒有 LINE，記得打電話。'
          : ''), 'success');

      notifyInBackground(r.notifyId);
      loadDays(S.selected, true);
    }

    async function saveBookingEdit() {
      const d = S.dialog;
      if (!d || d.busy || !d.selectedStart) return;

      if (!d.opId) d.opId = makeOpId();

      const req = {
        opId: d.opId,
        bookingId: d.item.booking.id,
        version: d.item.booking.version,
        newStart: d.selectedStart
      };

      d.busy = true;
      d.view = 'waiting';
      renderDialog();

      const begin = performance.now();
      let finished = false;

      const timer = setTimeout(() => {
        if (!finished && S.dialog === d) {
          d.busy = false;
          d.view = 'unknown';
          renderDialog();
        }
      }, 8000);

      try {
        const r = await call('apiReschedule', req);
        finished = true;
        clearTimeout(timer);

        if (S.dialog !== d) {
          loadDays(S.selected, true);
          return;
        }

        d.busy = false;

        if (r && r.ok) {
          bookingEditSuccess(r, performance.now() - begin);
          return;
        }

        if (r && r.code === 'BUSY') {
          d.view = 'confirmEdit';
          d.error = '系統正在處理，請稍等幾秒再按一次。' +
            '這次會沿用同一個操作編號。';
          renderDialog();
          return;
        }

        if (r && r.code === 'VERSION') {
          if (r.extra && r.extra.latest) {
            d.item.booking = r.extra.latest;
            d.item.start = r.extra.latest.start;
            d.item.end = r.extra.latest.end;
          }

          d.selectedStart = '';
          d.opId = null;
          d.error = '這筆預約剛剛被改過了，請重新選時間。';
          await loadSlots();
          d.error = '這筆預約剛剛被改過了，請重新選時間。';
          renderDialog();
          return;
        }

        if (r && r.code === 'CONFLICT') {
          d.selectedStart = '';
          d.opId = null;
          await loadSlots();
          d.error = '⚠️ 這個時間剛被約走了，請選其他時間。';
          renderDialog();
          return;
        }

        d.view = 'confirmEdit';
        d.error = responseError(r);
        renderDialog();

      } catch (err) {
        finished = true;
        clearTimeout(timer);

        if (S.dialog === d) {
          d.busy = false;
          d.view = 'unknown';
          d.error = err.message || String(err);
          renderDialog();
        }
      }
    }

    async function checkBookingEdit() {
      const d = S.dialog;
      if (!d || !d.opId || d.busy) return;

      d.busy = true;
      d.view = 'waiting';
      renderDialog();

      try {
        const r = await call('apiCheck', d.opId, d.item.booking.id);

        if (S.dialog !== d) return;

        d.busy = false;

        if (!r || !r.ok) {
          d.view = 'unknown';
          d.error = responseError(r);
          renderDialog();
          return;
        }

        if (r.done && r.result && r.result.ok) {
          bookingEditSuccess(r.result, 0);
          return;
        }

        if (r.done === false) {
          d.view = 'confirmEdit';
          d.error = '剛剛沒有查到這次修改。' +
            '若要再送出，會使用同一個操作編號。';
          renderDialog();
          return;
        }

        d.view = 'unknown';
        d.error = '目前仍無法確認，請稍後再查一次。';
        renderDialog();

      } catch (err) {
        if (S.dialog === d) {
          d.busy = false;
          d.view = 'unknown';
          d.error = '連線失敗，請稍後再查：' +
            (err.message || String(err));
          renderDialog();
        }
      }
    }

    async function saveRecurringOnce() {
      const d = S.dialog;
      if (!d || d.busy || !d.selectedStart) return;

      if (!d.opId) d.opId = makeOpId();

      const req = {
        opId: d.opId,
        recurringId: d.item.id,
        date: d.item.date || S.selected,
        newStart: d.selectedStart
      };

      if (d.minutes && Number(d.minutes) > 0) {
        req.minutes = Number(d.minutes);
      }

      await saveSimpleApi('apiRecurringOnce', req,
        '✅ 這一次的固定客時間已修改');
    }

    async function saveSimpleApi(fn, req, successText) {
      const d = S.dialog;
      if (!d || d.busy) return;

      d.busy = true;
      const oldView = d.view;
      d.view = 'waiting';
      d.selectedStart = d.selectedStart || d.item?.start || '';
      renderDialog();

      let finished = false;

      const timer = setTimeout(() => {
        if (!finished && S.dialog === d) {
          d.busy = false;
          d.view = 'unknownSimple';
          renderDialog();
        }
      }, 8000);

      try {
        const r = await call(fn, req);
        finished = true;
        clearTimeout(timer);

        if (S.dialog !== d) {
          loadDays(S.selected, true);
          return;
        }

        d.busy = false;

        if (!r || !r.ok) {
          if (r && r.code === 'BUSY') {
            d.error = '系統忙碌，請稍等幾秒再試。' +
              '再次送出會沿用同一個操作編號。';
          } else if (r && r.code === 'CONFLICT') {
            d.error = '⚠️ 這段時間已經有人安排，不能直接修改。';
          } else if (r && r.code === 'ALREADY') {
            d.error = fn === 'apiCreate' && req.lineUserId
              ? (r.message || '這個 LINE 已經連到另一位客人，請確認人選。')
              : '這一次已經轉成一般預約，請回首頁修改那筆。';
          } else {
            d.error = responseError(r);
          }

          d.view = oldView;
          renderDialog();
          return;
        }

        closeDialog(true);
        flash(successText, 'success');
        notifyInBackground(r.notifyId);
        loadDays(S.selected, true);

      } catch (err) {
        finished = true;
        clearTimeout(timer);

        if (S.dialog === d) {
          d.busy = false;
          d.view = 'unknownSimple';
          d.error = err.message || String(err);
          renderDialog();
        }
      }
    }

    function reviewFuture() {
      const d = S.dialog;
      if (!d) return;

      const from = $('futureFrom')?.value || '';
      if (!from) {
        d.error = '請先選擇生效日期';
        renderDialog();
        return;
      }

      const req = {
        opId: d.opId || makeOpId(),
        recurringId: d.item.id,
        from
      };

      if (d.stop) {
        req.stop = true;
      } else {
        const time = $('futureTime')?.value || '';
        const days = Array.from(
          document.querySelectorAll('input[name="weekdays"]:checked')
        ).map(x => x.value);

        if (!time || !days.length) {
          d.error = '請選開始時間和每週日期';
          renderDialog();
          return;
        }

        req.startTime = time;
        req.weekdays = days.join(',');

        const minutes = Number($('futureMinutes')?.value || 0);
        if (minutes > 0) req.minutes = minutes;
      }

      d.opId = req.opId;
      d.payload = req;
      d.view = 'reviewFuture';
      d.error = '';
      renderDialog();
    }

    async function createNewBooking() {
      const d = S.dialog;
      if (!d || d.busy) return;

      const customerId = $('newCustomer').value;
      const nickname = $('newName').value.trim();
      const phone = $('newPhone').value.trim();
      const serviceIds = Array.from(
        document.querySelectorAll('input[name="newService"]:checked')
      ).map(x => x.value);

      const date = $('createDate').value;
      const time = $('createTime').value;
      const minutes = Number($('createMinutes').value || 0);
      const note = $('createNote').value.trim();

      if (!customerId && (!nickname || (!d.lineUserId && !phone))) {
        d.error = d.lineUserId ? '請選既有客人，或填寫新客人的稱呼' : '請選既有客人，或填寫新客人的稱呼與電話';
        renderDialog();
        return;
      }

      if (!serviceIds.length || !date || !time) {
        d.error = '請填好服務、日期和開始時間';
        renderDialog();
        return;
      }

      const req = {
        opId: d.opId || makeOpId(),
        serviceIds,
        start: date + ' ' + time
      };

      if (customerId) {
        req.customerId = customerId;
      } else {
        req.nickname = nickname;
        req.phone = phone;
      }

      if (d.lineUserId) req.lineUserId = d.lineUserId;
      if (minutes > 0) req.minutes = minutes;
      if (note) req.note = note;

      d.opId = req.opId;
      d.selectedStart = req.start;

      await saveSimpleApi('apiCreate', req, '✅ 新預約已建立');
    }

        opId: null, busy: false,
        ...extra
      });
    }

    async function executeSimple() {
      const d = S.dialog;
      if (!d || d.busy) return;

      if (!d.opId) d.opId = makeOpId();

      if (d.action === 'transition') {
        const req = {
          opId: d.opId,
          bookingId: d.item.booking.id,
          version: d.item.booking.version,
          to: d.to
        };

        await saveSimpleApi('apiTransition', req,
          '✅ 預約狀態已更新');
      }

      else if (d.action === 'skip') {
        await saveSimpleApi('apiRecurringSkip', {
          opId: d.opId,
          recurringId: d.item.id,
          date: d.item.date || S.selected
        }, '✅ 已標記這次不來');
      }

      else if (d.action === 'restore') {
        await saveSimpleApi('apiRecurringUnskip', {
          opId: d.opId,
          recurringId: d.item.id,
          date: d.item.date || S.selected
        }, '✅ 已恢復這次固定客');
      }
    }

    async function prepareNew() {
      openDialog({
        kind: 'new',
        view: 'new',
        busy: false,
        error: '',
        opId: null,
        item: { start: S.selected + ' 00:00' }
      });

      try {
        const [services, customers] = await Promise.all([
          call('apiServices'),
          call('apiCustomers'),
          window.YaliLineLinks?.refresh(true)
        ]);

        if (services?.ok) S.services = services.services || [];
        if (customers?.ok) S.customers = customers.customers || [];

        if (S.dialog && S.dialog.kind === 'new') renderDialog();
      } catch (err) {
        if (S.dialog && S.dialog.kind === 'new') {
          S.dialog.error = '清單讀取失敗，請關閉後再開一次';
          renderDialog();
        }
      }
    }

    document.addEventListener('click', async event => {
      if (!KEY) return;
      const button = event.target.closest('[data-act]');
      if (!button || button.disabled) return;

      const act = button.dataset.act;
      const id = button.dataset.id;
      const date = button.dataset.date;

      try {
        if (act === 'reload') {
          await loadDays(S.selected);
        }

        else if (act === 'today') {
          await showDay(S.today);
        }

        else if (act === 'tomorrow') {
          await showDay(plusDays(S.today,1));
        }

        else if (act === 'pickDay') {
          $('dayPicker').focus();
          if ($('dayPicker').showPicker) {
            try { $('dayPicker').showPicker(); } catch (_) {}
          }
        }

        else if (act === 'prevDay') {
          await showDay(plusDays(S.selected,-1));
        }

        else if (act === 'nextDay') {
          await showDay(plusDays(S.selected,1));
        }

        else if (act === 'close') {
          closeDialog();
        }

        else if (act === 'new') {
          await prepareNew();
        }

        else if (act === 'editBooking') {
          const item = getItem(id);
          if (item) await startBookingEdit(item);
        }

        else if (act === 'editRecurring') {
          const item = getItem(id,date);
          if (item) await startRecurringEdit(item);
        }

        else if (act === 'restoreRecurring') {
          const item = getItem(id,date);
          if (item) {
            openSimple(item, 'restore',
              '要恢復這一次固定預約嗎？');
          }
        }

        else if (act === 'transition') {
          const item = getItem(id);
          const to = button.dataset.to;

          const labels = {
            CONFIRMED: '要確認這筆預約嗎？',
            REJECTED: '確定要拒絕這筆申請嗎？',
            CANCELLED: '確定要取消這筆預約嗎？',
            COMPLETED: '這筆服務已經做完了嗎？'
          };

          if (item) {
            openSimple(item, 'transition',
              labels[to] || '確定更新狀態嗎？',
              { to, danger: to === 'REJECTED' || to === 'CANCELLED' });
          }
        }

        else if (act === 'loadSlots') {
          const d = S.dialog;
          if (d && $('newDate')?.value) {
            d.date = $('newDate').value;
            d.selectedStart = '';
            d.opId = null;
            await loadSlots();
          }
        }

        else if (act === 'selectSlot') {
          selectSlot(button.dataset.start);
        }

        else if (act === 'backSlots') {
          if (S.dialog) {
            S.dialog.opId = null;
            S.dialog.view = 'slots';
            renderDialog();
          }
        }

        else if (act === 'saveEdit') {
          if (S.dialog?.kind === 'booking') await saveBookingEdit();
          else await saveRecurringOnce();
        }

        else if (act === 'checkEdit') {
          await checkBookingEdit();
        }

        else if (act === 'once') {
          if (S.dialog) {
            S.dialog.date = S.dialog.item.date || S.selected;
            S.dialog.opId = null;
            await loadSlots();
          }
        }

        else if (act === 'skip') {
          const item = S.dialog?.item;
          if (item) {
            openSimple(item, 'skip',
              '這位固定客這一次不來，確定要暫停嗎？');
          }
        }

        else if (act === 'future' || act === 'stop') {
          if (S.dialog) {
            S.dialog.stop = act === 'stop';
            S.dialog.view = 'future';
            S.dialog.error = '';
            renderDialog();
          }
        }

        else if (act === 'reviewFuture') {
          reviewFuture();
        }

        else if (act === 'saveFuture') {
          const d = S.dialog;
          if (d?.payload) {
            await saveSimpleApi('apiRecurringChange',
              d.payload, '✅ 固定客之後的安排已更新');
          }
        }

        else if (act === 'saveSimple') {
          await executeSimple();
        }

        else if (act === 'createBooking') {
          await createNewBooking();
        }

        else if (act === 'reloadAndClose') {
          closeDialog(true);
          await loadDays(S.selected);
          flash('請核對剛剛的安排是否已更新，再決定下一步。');
        }

      } catch (err) {
        const message = err.message || String(err);

        if (S.dialog) {
          S.dialog.error = message;
          renderDialog();
        } else {
          flash(message,'error');
        }
      }
    });

    $('dayPicker').addEventListener('change', event => {
      showDay(event.target.value);
    });

    // apiPulse is read-only. Never repaint an active form or acknowledge a
    // revision until its corresponding list has loaded successfully.
    let pulseRev = null, pulsePending = false, pulseRunning = false;
    let listRequest = 0;
    const autoStatus = document.createElement('p');
    autoStatus.className = 'small';
    autoStatus.setAttribute('role', 'status');
    autoStatus.setAttribute('aria-live', 'polite');
    $('appointments').before(autoStatus);
    function refreshBusy() {
      return Boolean(S.dialog || document.querySelector('#lineLinkDialog[open],#priceAppFrame:not([hidden])') || document.activeElement?.matches('input,select,textarea'));
    }
    function deferRefresh() {
      pulsePending = true;
      autoStatus.textContent = '有新消息，結束目前操作後會更新';
    }
    async function pulseTick() {
      if (!KEY || pulseRunning || document.visibilityState !== 'visible') return;
      pulseRunning = true;
      try {
        let timer;
        let r;
        try {
          r = await Promise.race([call('apiPulse'), new Promise((_,reject) => {
            timer = setTimeout(() => reject(new Error('pulse timeout')), 8000);
          })]);
        } finally { clearTimeout(timer); }
        if (!r?.ok || typeof r.rev !== 'string' || !r.rev) return;
        if (pulseRev === null && !pulsePending) { pulseRev = r.rev; return; }
        if (pulseRev === r.rev && !pulsePending) return;
        if (refreshBusy()) { deferRefresh(); return; }
        const loaded = await loadDays(S.selected, true, true);
        if (loaded) {
          pulseRev = r.rev;
          pulsePending = false;
          autoStatus.textContent = '已更新最新消息';
        } else if (!refreshBusy()) {
          pulsePending = true;
          autoStatus.textContent = '更新失敗，稍後再試';
        }
      } catch (_) { /* A failed lightweight poll must not interrupt work. */ }
      finally { pulseRunning = false; }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') pulseTick();
    });
    document.addEventListener('focusout', () => {
      if (pulsePending) setTimeout(pulseTick, 0);
    });
    setInterval(pulseTick, 30000);

    async function init() {
      if (!KEY || !BASE) {
        showKeyPrompt();
        $('appointments').innerHTML = '';
        return;
      }

      $('priceLink').href =
        'price.html#k=' + encodeURIComponent(KEY);

      // Establish revision before loading, so changes during initial load
      // are detected on the next pulse.
      await pulseTick();
      if (!KEY) return;
      await loadDays('', false);
    }

    document.getElementById('accessForm').addEventListener('submit', async event => {
      event.preventDefault();
      const value = document.getElementById('accessKey').value.trim();
      if (!YaliConnection.validKey(value)) {
        document.getElementById('accessError').textContent = '請貼上完整的 64 個英文或數字。';
        return;
      }
      KEY = value;
      YaliConnection.saveKey(value);
      location.hash = 'k=' + encodeURIComponent(value);
      document.getElementById('accessPanel').hidden = true;
      document.getElementById('accessKey').value = '';
      await init();
    });
    const priceAppFrame = document.createElement('iframe');
    priceAppFrame.id = 'priceAppFrame';
    priceAppFrame.title = '價目表管理';
    priceAppFrame.hidden = true;
    priceAppFrame.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;z-index:1000;background:#f8f7f3';
    document.body.append(priceAppFrame);
    $('priceLink').addEventListener('click', event => {
      event.preventDefault();
      if (!KEY) return;
      priceAppFrame.src = 'price.html#k=' + encodeURIComponent(KEY);
      priceAppFrame.hidden = false;
      document.querySelector('main').inert = true;
      document.body.style.overflow = 'hidden';
    });
    window.addEventListener('message', event => {
      if (event.origin !== location.origin || event.source !== priceAppFrame.contentWindow || event.data?.type !== 'yali-close-price') return;
      priceAppFrame.hidden = true;
      priceAppFrame.src = 'about:blank';
      document.querySelector('main').inert = false;
      document.body.style.overflow = '';
      $('priceLink').focus();
      pulseTick();
    });
    init();
  </script>
<script src="line-links.js"></script>
