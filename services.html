<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>雅麗髮藝｜服務價目</title><script src="config.js?v=12"></script>
<style>
:root{font-size:20px;--paper:#fbf9f5;--ink:#3b3732;--dim:#746b60;--red:#810112;--gold:#b69b6d;--line:#ded6c9}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:1rem}body{margin:0;color:var(--ink);background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC','Microsoft JhengHei',sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}.page{max-width:1060px;margin:auto;padding:2.5rem 1.3rem 3rem}.hero{position:relative;display:grid;grid-template-columns:1fr 100px;gap:1rem;align-items:center;padding:1.4rem 0 1.7rem;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.eyebrow{font-size:.63rem;letter-spacing:.24em;color:var(--dim);margin:0 0 .5rem}h1{font-size:1.6rem;font-weight:500;letter-spacing:.15em;margin:.3rem 0}.script{font:italic 3.3rem/1.2 Georgia,'Times New Roman',serif;margin:0;letter-spacing:-.04em}.hero img{width:100%;height:130px;object-fit:contain}.intro{color:var(--dim);font-size:.84rem;line-height:1.8;margin:1.4rem 0}.categories{display:flex;flex-wrap:wrap;gap:.55rem;margin:1rem 0 2rem}.categories a{font-size:.85rem;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:2rem;min-height:44px;padding:.35rem .9rem;display:flex;align-items:center}.categories a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.menu{display:grid;grid-template-columns:1fr 1fr;gap:2rem 3rem}.category{min-width:0}.category h2{display:flex;align-items:center;gap:.7rem;font-size:1.18rem;letter-spacing:.12em;font-weight:500;margin:0 0 1rem;padding-bottom:.6rem;border-bottom:1px solid var(--ink)}.number{font:italic 1rem Georgia,serif;color:var(--gold);letter-spacing:0}.item{margin:0;padding:.7rem 0;border-bottom:1px solid #e8e1d777}.item-main{display:flex;justify-content:space-between;gap:1rem;align-items:baseline}.name{overflow-wrap:anywhere;line-height:1.6}.price{font-variant-numeric:tabular-nums;font-size:1.12rem;white-space:nowrap;flex:none;color:#2d2925}.item-note{font-size:.76rem;color:var(--dim);margin:.2rem 0 0;white-space:pre-wrap}.note{font-size:.82rem;color:var(--dim);padding:1.2rem 0;margin-top:1.8rem;border-top:1px solid var(--line)}footer{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1.1rem 0;color:var(--dim);font-size:.7rem;border-top:1px solid var(--line)}footer a{color:var(--red)}#status{color:var(--dim);font-size:.88rem}button{font:inherit;color:var(--red);background:transparent;border:1px solid var(--line);border-radius:.5rem;min-height:48px;padding:.45rem 1rem;cursor:pointer}button:disabled{opacity:.5}[hidden]{display:none!important}@media(max-width:650px){.page{padding:1.2rem 1rem 2rem}.hero{grid-template-columns:1fr 70px}.hero img{height:100px}.script{font-size:2.5rem}h1{font-size:1.35rem}.menu{grid-template-columns:1fr;gap:1.8rem}.price{font-size:1.16rem}.categories{gap:.4rem}.categories a{padding:.3rem .7rem}footer{align-items:flex-start;flex-direction:column}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body><main class="page"><header class="hero"><div><p class="eyebrow">YALI · SALON DESIGN</p><p class="script" aria-hidden="true">Price List</p><h1>雅麗・服務價目</h1></div><img src="assets/yali-logo.svg" alt="雅麗髮藝標誌"></header><p class="intro">用心打理，每一段髮絲。<br>找到適合您的服務，讓我們安排下次見面。</p><p id="status" role="status" aria-live="polite">正在為您準備價目表…</p><button id="retry" type="button" hidden>重新讀取</button><nav class="categories" id="categories" aria-label="服務類別"></nav><div id="menu" class="menu"></div><p class="note" id="closing" hidden>想預約，請回到 LINE 點選「我要預約」，和我們聊聊您的安排。</p><footer><span>雅麗髮藝造型名店 · YALI SALON DESIGN</span><a href="https://lin.ee/xjUj0wS">LINE 通話</a></footer></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let busy=false;
function node(tag,text,className){const n=document.createElement(tag);n.textContent=text;if(className)n.className=className;return n;}
async function load(){if(busy)return;busy=true;$('retry').hidden=true;$('status').textContent='正在為您準備價目表…';
try{
 const url=new URL(window.YALI_POSTER_CONFIG.apiUrl);url.searchParams.set('fn','poster');url.searchParams.set('t',String(Date.now()));
 const control=new AbortController(),timer=setTimeout(()=>control.abort(),18000);let data;
 try{const r=await fetch(url.href,{credentials:'omit',signal:control.signal});if(!r.ok)throw Error('connection');data=await r.json();}finally{clearTimeout(timer);}
 if(data?.ok!==true||!Array.isArray(data.categories))throw Error('data');
 const categories=data.categories.map(c=>({name:typeof c.name==='string'?c.name:'',items:Array.isArray(c.items)?c.items.filter(i=>i&&typeof i.name==='string'&&typeof i.price==='string'&&!String(i.id||'').startsWith('T-')):[]})).filter(c=>c.items.length);
 if(!categories.length)throw Error('empty');
 $('menu').replaceChildren();$('categories').replaceChildren();
 categories.forEach((c,index)=>{
   const section=document.createElement('section');section.className='category';section.id='service-'+index;
   const title=document.createElement('h2');title.append(node('span',String(index+1).padStart(2,'0'),'number'),node('span',c.name));section.append(title);
   c.items.forEach(i=>{const row=document.createElement('div');row.className='item';const main=document.createElement('div');main.className='item-main';main.append(node('span',i.name,'name'),node('span',i.price,'price'));row.append(main);if(typeof i.note==='string'&&i.note)row.append(node('p',i.note,'item-note'));section.append(row);});
   $('menu').append(section);const link=node('a',c.name);link.href='#service-'+index;$('categories').append(link);
 });
 $('status').textContent='';$('closing').hidden=false;
}catch(e){$('status').textContent=e.name==='AbortError'?'這次讀取稍久，請再試一次。':'暫時讀不到價目表，請重新讀取，或透過 LINE 與我們聯絡。';$('retry').hidden=false;}finally{busy=false;}}
$('retry').addEventListener('click',load);load();})();
</script></body></html>
