<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>雅麗｜連線測試</title><script src="connection.js"></script><style>body{max-width:640px;margin:40px auto;padding:20px;background:#f7f4ee;color:#38342f;font:20px/1.7 system-ui}button,input{font:inherit;padding:14px;box-sizing:border-box;max-width:100%}button{background:#810112;color:white;border:0;border-radius:12px}input{width:100%;margin:12px 0}#result{white-space:pre-wrap}a{color:#810112}</style></head><body><h1>雅麗｜連線測試</h1><p>只讀取，不會修改預約。結果只顯示速度，不顯示客人資料。</p><label for="key">專用金鑰</label><input id="key" type="password" autocomplete="off" maxlength="64"><button id="run">開始測試</button><p id="result" role="status"></p><a href="index.html">回預約管理</a><script>
const keyInput=document.getElementById('key'), result=document.getElementById('result'), button=document.getElementById('run');
keyInput.value=YaliConnection.readKey();
button.onclick=async()=>{
 const key=keyInput.value.trim();
 if(!YaliConnection.validKey(key)){result.textContent='請用元家給的連結打開，或貼上完整金鑰。';return;}
 button.disabled=true;result.textContent='測試中…';const lines=[];
 try{
  for(const [name,fn,args] of [['只連線','apiPing',[]],['載入 14 天','apiDays',['',14]],['確認版本','apiPulse',[]]]){
   const start=performance.now();let timer;
   const r=await Promise.race([YaliConnection.call(key,fn,...args),new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('連線等待超過 30 秒')),30000)})]).finally(()=>clearTimeout(timer));
   if(!r?.ok) throw new Error(r?.code==='FORBIDDEN'?'金鑰不符，請用元家給的連結打開。':'連線未完成，請稍後再試。');
   lines.push(name+'：'+((performance.now()-start)/1000).toFixed(2)+' 秒');result.textContent=lines.join('\n');
  }
 }catch(e){result.textContent=lines.concat(e.message).join('\n');}finally{button.disabled=false;}
};
</script></body></html>
